<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot NIKO</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body>
<script src="three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);if(THREE.ColorManagement)THREE.ColorManagement.enabled=false;if(THREE.LinearSRGBColorSpace)R.outputColorSpace=THREE.LinearSRGBColorSpace;R.useLegacyLights=true;
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(36,1,.1,50);let zoom=9;
function fit(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}fit();addEventListener('resize',fit);
S.add(new THREE.HemisphereLight(0xcfe6ff,0x1a2a55,1.15));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,6,6);S.add(dl);
const rim=new THREE.PointLight(0x2f8cff,1.3,14);rim.position.set(-4,3,-3);S.add(rim);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.3,metalness:.15},o));
const white=M(0xf0f4ff),blue=M(0x1f6dff,{metalness:.4}),dark=M(0x0a1226),glow=new THREE.MeshBasicMaterial({color:0x5ff3ff});
const B=(p,m,x,y,z,sx,sy,sz)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz||sx);p.add(o);return o};
const G=(p,x,y,z)=>{const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g};
const holder=G(S,0,0,0),robot=G(holder,0,0,0);
const legs=[-1,1].map(s=>{const h=G(robot,s*.34,1.15,0);B(h,dark,0,0,0,.15);B(h,white,0,-.27,0,.2,.34,.21);const k=G(h,0,-.5,0);B(k,dark,0,0,0,.14);B(k,white,0,-.24,0,.19,.3,.2);B(k,blue,0,-.34,.03,.2,.12,.22);B(k,blue,0,-.46,.1,.26,.14,.36);return{h,k}});
B(robot,white,0,1.62,0,.58,.52,.44);B(robot,blue,0,1.22,0,.4,.2,.3);B(robot,dark,0,1.4,0,.3,.14,.25);B(robot,dark,0,2.0,0,.14,.12,.14);
const bc=document.createElement('canvas');bc.width=bc.height=128;{const x=bc.getContext('2d');x.fillStyle='#1f6dff';x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;x.lineTo(64+58*Math.cos(a),64+58*Math.sin(a))}x.fill();x.fillStyle='#fff';x.font='bold 58px system-ui,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('AI',64,68)}
const badge=new THREE.Mesh(new THREE.PlaneGeometry(.42,.42),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bc),transparent:true}));badge.position.set(0,1.66,.45);robot.add(badge);
const head=G(robot,0,2.55,0);B(head,white,0,0,0,.95,.8,.82);B(head,dark,0,0,.62,.74,.54,.24);B(head,blue,0,.62,.1,.34,.12,.45);
for(const s of[-1,1]){const fin=new THREE.Mesh(new THREE.BoxGeometry(.12,.5,.1),blue);fin.position.set(s*.62,.78,0);fin.rotation.z=-s*.3;head.add(fin);
const ph=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.2,24),blue);ph.rotation.z=Math.PI/2;ph.position.set(s*.98,0,0);head.add(ph);
const pg=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.24,24),glow);pg.rotation.z=Math.PI/2;pg.position.set(s*.99,0,0);head.add(pg)}
const fc=document.createElement('canvas');fc.width=256;fc.height=160;const fx=fc.getContext('2d'),ftex=new THREE.CanvasTexture(fc);
const face=new THREE.Mesh(new THREE.PlaneGeometry(1.15,.72),new THREE.MeshBasicMaterial({map:ftex,transparent:true}));face.position.set(0,0,.88);head.add(face);
let gc='#5ff3ff';
function drawFace(st,bl,mo){const x=fx;x.clearRect(0,0,256,160);x.strokeStyle=x.fillStyle=gc;x.shadowColor=gc;x.shadowBlur=16;x.lineWidth=11;x.lineCap='round';
const eye=(cx,k)=>{x.beginPath();x.lineWidth=11;if(k=='o'){x.ellipse(cx,66,15,22,0,0,7);x.fill()}else if(k=='b'){x.moveTo(cx-14,70);x.lineTo(cx+14,70);x.stroke()}else if(k=='h'){x.arc(cx,82,24,Math.PI*1.12,Math.PI*1.88);x.stroke()}else if(k=='w'){x.lineWidth=7;x.arc(cx,66,18,0,7);x.stroke()}else{x.arc(cx,58,24,Math.PI*.12,Math.PI*.88);x.stroke()}};
const ks={open:'oo',happy:'hh',wow:'ww',wink:'oh',sleep:'ss'}[st];
eye(78,bl&&ks[0]=='o'?'b':ks[0]);eye(178,bl&&ks[1]=='o'?'b':ks[1]);x.beginPath();
if(st=='wow'){x.lineWidth=7;x.arc(128,120,13,0,7);x.stroke()}else if(mo>.12){x.ellipse(128,106,22,4+mo*20,0,0,Math.PI);x.fill()}else{x.arc(128,102,28,Math.PI*.15,Math.PI*.85);x.stroke()}
ftex.needsUpdate=true}
const arms=[-1,1].map(s=>{const sh=G(robot,s*.74,1.9,0);B(sh,blue,0,0,0,.2);B(sh,white,s*.03,-.25,0,.16,.28,.16);const el=G(sh,s*.03,-.5,0);B(el,dark,0,0,0,.12);B(el,blue,0,-.2,0,.15,.24,.15);B(el,white,0,-.46,.03,.17);B(el,white,0,-.6,.05,.06,.1,.06);return{sh,el}});
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.5,.03,8,64),glow);ring.rotation.x=Math.PI/2;ring.position.y=.02;S.add(ring);
const disc=new THREE.Mesh(new THREE.CircleGeometry(1.5,48),new THREE.MeshBasicMaterial({color:0x0b2a66,transparent:true,opacity:.6}));disc.rotation.x=-Math.PI/2;disc.position.y=.01;S.add(disc);
const D={y:0,ry:0,rx:0,rz:0,hx:0,hy:0,hz:0,Lsx:0,Lsz:.15,Lex:0,Rsx:0,Rsz:.15,Rex:0,Lh:0,Rh:0,Lk:0,Rk:0},P=Object.assign({},D);
const sn=Math.sin,ab=Math.abs;
const POSES={
stand:{n:'🧍 Berdiri',f:'open',fn:(t,o)=>{o.y=.03*sn(t*2);o.Lsx=o.Rsx=-.5;o.Lex=o.Rex=-1.9;o.Lsz=o.Rsz=.3;o.hz=.04*sn(t*1.5)}},
wave:{n:'👋 Melambai',f:'happy',fn:(t,o)=>{o.Rsz=2.4+.22*sn(t*8);o.Rex=-.3;o.hz=.08*sn(t*3);o.y=.025*sn(t*3)}},
walk:{n:'🚶 Berjalan',f:'open',fn:(t,o)=>{const w=sn(t*5);o.Lh=.55*w;o.Rh=-.55*w;o.Lk=Math.max(0,-w)*.9;o.Rk=Math.max(0,w)*.9;o.Lsx=-.5*w;o.Rsx=.5*w;o.y=ab(w)*.05}},
dance:{n:'💃 Menari',f:'happy',fn:(t,o)=>{const w=sn(t*5);o.ry=.4*sn(t*2.5);o.y=.1+ab(w)*.12;o.Lsz=1.4+.6*w;o.Rsz=1.4-.6*w;o.Lex=-.5*w;o.Rex=.5*w;o.Lh=.3*w;o.Rh=-.3*w;o.hz=.2*w;o.mo=.5+.5*w}},
jump:{n:'⬆️ Melompat',f:'happy',fn:(t,o)=>{const p=Math.max(0,sn(t*3));o.y=p*.9;o.Lsz=o.Rsz=2.6;o.Lk=o.Rk=p;o.Lh=o.Rh=-p*.5}},
bow:{n:'🙇 Membungkuk',f:'sleep',fn:(t,o)=>{const k=(1-Math.cos(t*1.6))/2;o.rx=.4*k;o.hx=.4*k;o.Lsx=o.Rsx=.3*k;o.Lsz=o.Rsz=.1}},
sit:{n:'🧘 Duduk',f:'sleep',fn:(t,o)=>{o.y=-.9;o.Lh=o.Rh=-1.5;o.Lk=o.Rk=.25;o.Lsx=o.Rsx=-.7;o.Lex=o.Rex=-.4;o.Lsz=o.Rsz=.2;o.hz=.05*sn(t*1.5)}},
surprise:{n:'😮 Terkejut',f:'wow',fn:(t,o)=>{o.y=.06*ab(sn(t*10));o.Lsx=o.Rsx=-1;o.Lsz=o.Rsz=.45;o.Lex=o.Rex=-2.3;o.hx=-.1;o.hz=.05*sn(t*20)}},
thumbs:{n:'👍 Thumbs Up',f:'wink',fn:(t,o)=>{o.Rsx=-1;o.Rsz=.3;o.Rex=-1.6;o.hz=.1;o.y=.03*sn(t*3)}}};
POSES.look={n:'celingak',f:'open',fn:(t,o)=>{o.hy=.7*sn(t*1.2);o.hz=.1*sn(t*1.2);o.Lsz=o.Rsz=.2}};
POSES.stretch={n:'regang',f:'happy',fn:(t,o)=>{o.Lsz=o.Rsz=2.8;o.hx=-.2;o.y=.05+.04*sn(t*2.5)}};
POSES.spin={n:'putar',f:'happy',fn:(t,o)=>{o.ry=Math.PI*2*Math.min(t/2.2,1);o.Lsz=o.Rsz=1.1;o.y=.1*sn(Math.min(t/2.2,1)*Math.PI)}};
POSES.nod={n:'angguk',f:'happy',fn:(t,o)=>{o.hx=.35*sn(t*6);o.Lsz=o.Rsz=.2}};
POSES.run={n:'lari',f:'open',fn:(t,o)=>{const w=sn(t*9);o.Lh=.9*w;o.Rh=-.9*w;o.Lk=Math.max(0,-w)*1.2;o.Rk=Math.max(0,w)*1.2;o.Lsx=-.9*w;o.Rsx=.9*w;o.Lex=o.Rex=-1.2;o.rx=.12;o.y=ab(w)*.1}};
const TH=[['#1f6dff','#5ff3ff'],['#ff3d5e','#ffd1a0'],['#14b86a','#a6ffd2'],['#9b4dff','#e6c4ff']];
function setColor(i){const c=TH[(+i||0)%TH.length];blue.color.set(c[0]);glow.color.set(c[1]);rim.color.set(c[0]);gc=c[1];last=''}
const names=Object.keys(POSES);let cur='wave',T=0,TT=0,speak=0,last='',nx=4;
function setPose(k,hold){if(POSES[k]){if(k!=cur){cur=k;T=0;P.ry=Math.atan2(Math.sin(P.ry),Math.cos(P.ry))}nx=TT+(hold||4+Math.random()*3)}}
function randPose(){let k;do{k=names[Math.floor(Math.random()*names.length)]}while(k==cur);setPose(k)}
window.setPose=setPose;window.setColor=setColor;window.speak=s=>{speak=s||3};
window.robotBicara=function(teks,ms){speak=(ms||5000)/1000;if(cur=='sit'||cur=='bow'||cur=='surprise')setPose('stand',speak+1);else nx=Math.max(nx,TT+speak)};
window.poke=function(){setPose('surprise',3)};
const ACT=['stand','dance','wave','dance','look','stretch','spin','sit','jump','dance','nod','run','dance','wave'];
window.setAksi=function(n,d){setPose(ACT[(n|0)%ACT.length],(d||4000)/1000+1.5)};
addEventListener('message',e=>{const d=e.data;if(typeof d=='string'){if(POSES[d])setPose(d,8);else if(d=='speak'||d=='talk')speak=3;else if(d=='stop')speak=0}
else if(d&&typeof d=='object'){if(d.pose)setPose(d.pose,8);if(d.speak)speak=+d.speak||3;if(d.color!=null)setColor(d.color)}});

let GS=null,gi=0,gt=0,fOv=null;const DEG=Math.PI/180,lim=(v,a,b)=>Math.max(a,Math.min(b,+v||0)),FACE={senang:'happy',biasa:'open',kaget:'wow',kedip:'wink',tidur:'sleep'};
window.robotLangkah=function(a){if(Array.isArray(a)&&a.length){GS=a.slice(0,8);gi=0;gt=0}};
function gestur(dt,o){if(!GS)return;const s=GS[gi]||{},ms=lim(s.ms||300,150,800)/1000;nx=Math.max(nx,TT+1);
if('kpl' in s)o.hz=lim(s.kpl,-25,25)*DEG;if('ang' in s)o.hx=lim(s.ang,-25,25)*DEG;
if('tka' in s)o.Rsz=lim(s.tka,0,170)*DEG;if('tki' in s)o.Lsz=lim(s.tki,0,170)*DEG;
if('ska' in s)o.Rex=-lim(s.ska,0,120)*DEG;if('ski' in s)o.Lex=-lim(s.ski,0,120)*DEG;
if('kk' in s)o.Rh=-lim(s.kk,-40,40)*DEG;if('kl' in s)o.Lh=-lim(s.kl,-40,40)*DEG;
if('tek' in s)o.Lk=o.Rk=lim(s.tek,0,80)*DEG;
fOv=FACE[s.wajah]||null;gt+=dt;if(gt>=ms){gt=0;gi++;if(gi>=GS.length){GS=null;fOv=null}}}
const clk=new THREE.Clock();
(function tick(){requestAnimationFrame(tick);const dt=Math.min(clk.getDelta(),.05);T+=dt;TT+=dt;if(TT>nx)randPose();
const pd=POSES[cur],o=Object.assign({},D);pd.fn(T,o);gestur(dt,o);const fs=fOv||pd.f;let mo=o.mo||0;if(fs=='happy')mo=Math.max(mo,.35);if(speak>0){speak-=dt;mo=.15+.85*ab(sn(TT*13))}
const k=1-Math.pow(.0005,dt);for(const key in D)P[key]+=(o[key]-P[key])*k;
holder.rotation.y=.2;robot.position.y=P.y;robot.rotation.set(P.rx,P.ry,P.rz);head.rotation.set(P.hx,P.hy,P.hz);
arms[0].sh.rotation.set(P.Lsx,0,-P.Lsz);arms[1].sh.rotation.set(P.Rsx,0,P.Rsz);arms[0].el.rotation.x=P.Lex;arms[1].el.rotation.x=P.Rex;
legs[0].h.rotation.x=P.Lh;legs[1].h.rotation.x=P.Rh;legs[0].k.rotation.x=P.Lk;legs[1].k.rotation.x=P.Rk;
const bl=TT%3.3<.14,key=fs+bl+Math.round(mo*6)+gc;if(key!=last){last=key;drawFace(fs,bl,mo)}
const asp=innerWidth/innerHeight;C.position.set(0,1.75,Math.max(6.4,4.9/asp));C.lookAt(0,1.7,0);R.render(S,C)})();
</script></body></html>
