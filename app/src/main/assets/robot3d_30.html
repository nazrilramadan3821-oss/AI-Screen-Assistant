<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot AI Imut 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#061329;color:#eef8ff;font:14px system-ui;overflow:hidden}#stage{position:fixed;inset:0}.top{position:fixed;top:12px;left:12px;background:#071a35dd;padding:9px 13px;border:1px solid #289dff;border-radius:12px}.panel{position:fixed;bottom:10px;left:10px;right:10px;max-width:900px;margin:auto;background:#06152bea;border:1px solid #258dff;border-radius:16px;padding:12px;max-height:39vh;overflow:auto}h3{margin:0 0 8px;color:#8bdcff}.buttons{display:flex;flex-wrap:wrap;gap:7px}.buttons button{background:#102e56;color:white;border:1px solid #328fe0;border-radius:10px;padding:8px 10px;font-size:12px}.buttons button.active{background:#0875ce}.hint{font-size:11px;color:#b8d7f4;margin-top:8px}</style></head><body>
<div id="stage"></div><div class="top">🤖 ROBOT AI IMUT • 3D MOTION PACK</div><div class="panel"><h3>30 variasi gerakan</h3><div class="buttons" id="buttons"></div><div class="hint">Geser untuk memutar • Cubit/scroll untuk zoom • Pilih gerakan untuk animasi.</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06132b);scene.fog=new THREE.Fog(0x06132b,11,25);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(5,4.2,8.7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.querySelector('#stage').appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.65,0);orbit.enableDamping=true;orbit.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xc5e5ff,0x18213d,2));let sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,8,5);sun.castShadow=true;scene.add(sun);
const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,metalness:.4,roughness:.28,emissive:e});
const blue=mat(0x0879ed),cyan=mat(0x54caff,0x06294b),white=mat(0xeaf4ff),dark=mat(0x071326),glow=mat(0x39eaff,0x12cfff);
const robot=new THREE.Group();scene.add(robot);
function ball(p,m,pos,sc){let o=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),m);o.position.set(...pos);o.scale.set(...sc);o.castShadow=true;p.add(o);return o}
function joint(p){ball(p,dark,[0,0,0],[.18,.18,.18]);ball(p,cyan,[0,0,0],[.1,.1,.1])}
const legs=[],arms=[];
for(const s of [-1,1]){
 let foot=new THREE.Group();foot.position.set(s*.42,.2,.08);robot.add(foot);ball(foot,white,[0,0,0],[.34,.21,.46]);ball(foot,blue,[0,-.08,.14],[.3,.1,.3]);
 let hip=new THREE.Group();hip.position.set(s*.42,1.04,0);robot.add(hip);joint(hip);ball(hip,white,[0,-.28,0],[.24,.36,.25]);ball(hip,blue,[0,-.48,0],[.22,.12,.23]);
 let knee=new THREE.Group();knee.position.y=-.56;hip.add(knee);joint(knee);ball(knee,white,[0,-.27,0],[.22,.33,.24]);ball(knee,blue,[0,-.47,.02],[.23,.12,.25]);legs.push({hip,knee,s});
}
ball(robot,blue,[0,1.35,0],[.62,.46,.37]);ball(robot,white,[0,1.55,.02],[.58,.47,.36]);ball(robot,blue,[0,1.18,0],[.42,.22,.3]);ball(robot,white,[0,1.49,.36],[.23,.19,.04]);ball(robot,glow,[0,1.49,.405],[.12,.12,.03]);
let neck=new THREE.Mesh(new THREE.CylinderGeometry(.16,.18,.2,24),dark);neck.position.y=1.95;robot.add(neck);
const head=new THREE.Group();head.position.set(0,2.31,0);robot.add(head);ball(head,white,[0,0,0],[.72,.61,.56]);ball(head,blue,[0,.47,-.02],[.31,.14,.45]);ball(head,dark,[0,-.015,.48],[.57,.38,.11]);
const eyes=[ball(head,glow,[-.22,.02,.585],[.075,.105,.03]),ball(head,glow,[.22,.02,.585],[.075,.105,.03])];const mouth=ball(head,glow,[0,-.19,.59],[.1,.035,.025]);
for(const s of [-1,1]){ball(head,blue,[s*.7,0,0],[.17,.25,.18]);ball(head,cyan,[s*.77,0,.03],[.07,.14,.12])}
let ant=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.2,16),blue);ant.position.y=.63;head.add(ant);ball(head,glow,[0,.74,0],[.08,.08,.08]);
for(const s of [-1,1]){let sh=new THREE.Group();sh.position.set(s*.6,1.72,0);robot.add(sh);ball(sh,blue,[0,0,0],[.22,.22,.22]);ball(sh,white,[s*.1,-.25,0],[.18,.29,.18]);let el=new THREE.Group();el.position.set(s*.12,-.48,0);sh.add(el);joint(el);ball(el,blue,[0,-.18,0],[.17,.23,.17]);let wr=new THREE.Group();wr.position.y=-.38;el.add(wr);ball(wr,white,[0,-.03,.02],[.19,.16,.17]);for(let i=0;i<4;i++)ball(wr,white,[(i-1.5)*.07,-.16,.05],[.04,.1,.045]);arms.push({shoulder:sh,elbow:el,wrist:wr,s})}
const floor=new THREE.Mesh(new THREE.CircleGeometry(8,64),mat(0x0b1c38));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;scene.add(floor);
const names=[['idle','🙂 Diam santai'],['wave','👋 Melambai'],['wave2','👋 Dua tangan'],['walk','🚶 Berjalan'],['run','🏃 Berlari'],['dance','💃 Menari'],['jump','⬆️ Melompat'],['spin','🌀 Berputar'],['bow','🙇 Membungkuk'],['nod','👌 Mengangguk'],['shake','🙅 Menggeleng'],['look','👀 Tengok kiri-kanan'],['think','🤔 Berpikir'],['surprise','😮 Terkejut'],['happy','😄 Senang'],['sad','🥺 Sedih'],['sleep','😴 Tidur'],['clap','👏 Tepuk tangan'],['cheer','🎉 Bersorak'],['point','👉 Menunjuk'],['salute','🫡 Hormat'],['stretch','🙆 Meregang'],['squat','🧎 Jongkok'],['robot','🦾 Gerakan robot'],['tiptoe','🩰 Berjinjit'],['march','🥁 Jalan di tempat'],['hiphop','🎵 Goyang'],['shy','😊 Malu'],['present','🎁 Memperkenalkan'],['goodbye','💙 Dadah']];
let mode='idle',time=0;const buttons=document.querySelector('#buttons');
names.forEach(([id,label],i)=>{let b=document.createElement('button');b.textContent=label;b.dataset.id=id;if(!i)b.classList.add('active');b.onclick=()=>{mode=id;time=0;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))};buttons.appendChild(b)});
window.setGerakan=id=>{const b=document.querySelector('button[data-id="'+id+'"]');if(b)b.click()};window.daftarGerakan=names.map(n=>n[0]);
const arm=s=>arms.find(a=>a.s===s),leg=s=>legs.find(a=>a.s===s);
function animate(){requestAnimationFrame(animate);time+=.016;let w=Math.sin(time*3),f=Math.sin(time*7),walk=Math.sin(time*5);
robot.position.set(0,0,0);robot.rotation.set(0,0,0);head.rotation.set(0,0,0);
arms.forEach(a=>{a.shoulder.rotation.set(0,0,-a.s*.12);a.elbow.rotation.z=0;a.wrist.rotation.z=0});legs.forEach(l=>{l.hip.rotation.x=0;l.knee.rotation.x=0});eyes.forEach(e=>e.scale.y=.105);mouth.scale.set(.1,.035,.025);
if(mode==='idle'){robot.position.y=.03*Math.sin(time*2);head.rotation.z=.025*w}
if(mode==='wave'||mode==='goodbye'){arm(1).shoulder.rotation.z=-2.35+.18*w;arm(1).elbow.rotation.z=-.5+.28*w;arm(1).wrist.rotation.z=.3*w}
if(mode==='wave2')arms.forEach(a=>{a.shoulder.rotation.z=-a.s*2.2+.15*w;a.elbow.rotation.z=-.45+.2*w});
if(['walk','march','run','tiptoe'].includes(mode)){let speed=mode==='run'?9:5;legs.forEach(l=>{l.hip.rotation.x=(mode==='run'?.85:.48)*Math.sin(time*speed)*l.s;l.knee.rotation.x=Math.max(0,-Math.sin(time*speed)*l.s)*(mode==='run'?1.1:.75)});arms.forEach(a=>a.shoulder.rotation.z=a.s*.5*Math.sin(time*speed));robot.position.y=(mode==='tiptoe'?.1:.04)+Math.abs(Math.sin(time*speed))*.07}
if(['dance','hiphop'].includes(mode)){robot.rotation.y=.28*Math.sin(time*2.5);robot.rotation.z=.08*Math.sin(time*5);robot.position.y=.1+Math.abs(Math.sin(time*4))*.13;arms.forEach(a=>{a.shoulder.rotation.z=-a.s*1.5+.35*Math.sin(time*5);a.elbow.rotation.z=.65*Math.sin(time*5+a.s)});legs.forEach(l=>l.hip.rotation.x=.38*Math.sin(time*5)*l.s);head.rotation.z=.22*Math.sin(time*4)}
if(mode==='jump'){robot.position.y=Math.max(0,Math.sin(time*2.8))*.8;arms.forEach(a=>a.shoulder.rotation.z=-a.s*1.65);legs.forEach(l=>{l.hip.rotation.x=.35;l.knee.rotation.x=.35})}
if(mode==='spin'){robot.rotation.y=time*2.5;arms.forEach(a=>a.shoulder.rotation.z=-a.s*1.1)}
if(mode==='bow'){robot.rotation.x=.13;head.rotation.x=.45;arms.forEach(a=>a.shoulder.rotation.z=-a.s*.35)}
if(mode==='nod')head.rotation.x=.2*Math.sin(time*4);
if(mode==='shake'||mode==='look')head.rotation.y=(mode==='shake'?.45:.75)*Math.sin(time*3);
if(mode==='think'){head.rotation.z=.12;arm(1).shoulder.rotation.z=-1.7;arm(1).elbow.rotation.z=-1.2}
if(mode==='surprise'){eyes.forEach(e=>e.scale.y=.15);mouth.scale.set(.085,.085,.03);arms.forEach(a=>a.shoulder.rotation.z=-a.s*1.15)}
if(mode==='happy'||mode==='cheer'){mouth.scale.set(.15,.07,.03);arms.forEach(a=>a.shoulder.rotation.z=-a.s*1.8);robot.position.y=.04+Math.abs(Math.sin(time*5))*.12}
if(mode==='sad'){head.rotation.x=.25;head.rotation.z=.12;arms.forEach(a=>a.shoulder.rotation.z=a.s*.5);mouth.scale.set(.07,.018,.02)}
if(mode==='sleep'){head.rotation.z=.18;head.rotation.x=.2;eyes.forEach(e=>e.scale.y=.012)}
if(mode==='clap'){arms.forEach(a=>{a.shoulder.rotation.z=-a.s*1.1;a.elbow.rotation.z=-a.s*.8+.25*Math.sin(time*8)})}
if(mode==='point'){arm(1).shoulder.rotation.z=-1.4;arm(1).elbow.rotation.z=-.25;head.rotation.y=-.2}
if(mode==='salute'){arm(1).shoulder.rotation.z=-2.5;arm(1).elbow.rotation.z=-1.1}
if(mode==='stretch')arms.forEach(a=>a.shoulder.rotation.z=-a.s*2.7);
if(mode==='squat'){legs.forEach(l=>{l.hip.rotation.x=-.8;l.knee.rotation.x=1.25});robot.position.y=-.18}
if(mode==='robot'){robot.rotation.y=.08*Math.sign(Math.sin(time*4));head.rotation.y=.25*Math.sign(Math.sin(time*4));arms.forEach(a=>{a.shoulder.rotation.z=-a.s*(Math.sin(time*4)>0?1.25:.2);a.elbow.rotation.z=Math.sin(time*4)>0?-.8:0});legs.forEach(l=>l.hip.rotation.x=.3*Math.sign(Math.sin(time*4)))}
if(mode==='shy'){head.rotation.z=.2;head.rotation.y=.15*Math.sin(time*2);arms.forEach(a=>a.shoulder.rotation.z=-a.s*.9)}
if(mode==='present'){arm(1).shoulder.rotation.z=-1.5;arm(1).elbow.rotation.z=-.4;head.rotation.y=-.18}
if(Math.sin(time*1.7)>.985&&mode!=='surprise'&&mode!=='sleep')eyes.forEach(e=>e.scale.y=.012);
orbit.update();renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
