<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Asisten</title>
<style>
:root{--bg:#0b1020;--panel:#131a30;--line:#24304f;--text:#e8ecf8;--mut:#8a96b8;--a:#3b82f6;--b:#7c3aed}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header b{font-size:18px}
header span{color:var(--mut);font-size:13px}
#key{margin-left:auto}
#clear,#key{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:6px 12px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--b));border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.msg code{background:#0006;padding:1px 5px;border-radius:5px}
.err{border-color:#7f1d1d;color:#fecaca}
.empty{margin:auto;text-align:center;color:var(--mut);max-width:300px}
.empty h2{color:var(--text);margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px}
#bar{padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
#preview{display:none;align-items:center;gap:10px;margin-bottom:8px}
#preview img{height:56px;border-radius:8px}
#preview button{background:none;border:none;color:var(--mut);font-size:14px}
#row{display:flex;gap:8px;align-items:flex-end}
.ic{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:20px}
textarea{flex:1;resize:none;max-height:120px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 12px;font:inherit}
textarea:focus{outline:2px solid var(--a);outline-offset:0}
#send{flex:none;height:44px;padding:0 16px;border:none;border-radius:12px;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--a),var(--b))}
button:disabled{opacity:.5}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}

#nkOrb{position:fixed;right:14px;bottom:92px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7db4ff,#1a56ff);box-shadow:0 0 12px #1a56ff88;z-index:9;cursor:pointer}
#nkOrb.listen{animation:nkp 1.1s infinite}
#nkOrb.speak{animation:nkp .5s infinite;background:radial-gradient(circle at 35% 30%,#9dffd0,#12b886)}
#nkOrb.think{opacity:.6}
@keyframes nkp{50%{transform:scale(1.25);box-shadow:0 0 24px #4d8bff}}
#nkPanel{position:fixed;inset:0;margin:auto;width:min(92vw,360px);height:fit-content;max-height:90vh;overflow:auto;background:#121a33;color:#e8ecff;border:1px solid #2a3358;border-radius:16px;padding:16px;z-index:20;display:flex;flex-direction:column;gap:12px}
#nkPanel[hidden]{display:none}
#nkPanel h3{margin:0;font-size:16px}
#nkPanel label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
#nkPanel input[type=text],#nkPanel select{background:#0a0f1f;color:#e8ecff;border:1px solid #2a3358;border-radius:8px;padding:6px;max-width:150px}
#nkPanel button{background:#4f6bff;color:#fff;border:0;border-radius:10px;padding:10px}

#hsPanel{position:fixed;inset:0;margin:auto;width:min(92vw,380px);height:fit-content;max-height:85vh;overflow:auto;background:#121a33;color:#e8ecff;border:1px solid #2a3358;border-radius:16px;padding:16px;z-index:21;display:flex;flex-direction:column;gap:10px}
#hsPanel[hidden]{display:none}
#hsPanel h3{margin:0;font-size:16px}
#hsPanel button{background:#4f6bff;color:#fff;border:0;border-radius:10px;padding:10px}
#hsList{display:flex;flex-direction:column;gap:8px;font-size:14px}
.hsRow{display:flex;gap:6px}
.hsRow .hsItem{flex:1;text-align:left;background:#0a0f1f;border:1px solid #2a3358;font-size:13px}
.hsRow .hsDel{background:#3a2030;padding:10px 12px}
</style>
</head>
<body>
<header><b>AI Asisten</b><span>tanya, foto soal, pindai layar</span><button id="key">Kunci</button><button id="clear">Hapus</button></header>
<main id="chat"></main>
<div id="hsPanel" hidden>
  <h3>Histori Obrolan</h3>
  <div id="hsList"></div>
  <button id="hsNew">Obrolan baru</button>
  <button id="hsAll">Hapus semua histori</button>
  <button id="hsClose">Tutup</button>
</div>
<div id="nkOrb"></div>
<div id="nkPanel" hidden>
  <h3>Pengaturan Suara NIKO</h3>
  <label>Bacakan jawaban <input type="checkbox" id="nkSpeak"></label>
  <label>Selalu mendengar <input type="checkbox" id="nkAlways"></label>
  <label>Kata panggil <input type="text" id="nkWake"></label>
  <label>Bahasa <select id="nkLang"><option value="id-ID">Indonesia</option><option value="en-US">English</option></select></label>
  <label>Kecepatan suara <input type="range" id="nkRate" min="0.6" max="1.6" step="0.1"></label>
  <button id="nkBg">Aktifkan NIKO di luar aplikasi</button>
  <button id="nkBgOff">Matikan NIKO latar belakang</button>
  <button id="nkAcc">Izin scroll dan ketuk (Aksesibilitas)</button>
  <button id="nkBat">Izinkan jalan di latar (baterai)</button>
  <button id="nkClose">Tutup</button>
</div>
<div id="bar">
  <div id="preview"><img id="pimg" alt="Gambar terpilih"><button id="prm">Lepas gambar</button></div>
  <div id="row">
    <button class="ic" id="cam" title="Pilih gambar atau kamera" aria-label="Pilih gambar atau kamera">📷</button>
    <button class="ic" id="scr" title="Pindai layar" aria-label="Pindai layar">🖥️</button>
    <button class="ic" id="nkMic" title="Bicara" aria-label="Bicara">🎤</button>
    <button class="ic" id="nkSet" title="Pengaturan suara" aria-label="Pengaturan suara">⚙️</button>
    <button class="ic" id="hsBtn" title="Histori" aria-label="Histori">🕘</button>
    <textarea id="txt" rows="1" placeholder="Tulis pertanyaan atau soal…"></textarea>
    <button id="send">Kirim</button>
  </div><button id="genBtn" onclick="window.location.href='https://verbose-space-meme-gxpg69jx4gx73v4gq-3000.app.github.dev'">Buat Gambar AI</button>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<script>
const MODEL = "gemini-flash-lite-latest";
function getKey(){ try{return localStorage.getItem("gkey")||""}catch(e){return ""} }
function askKey(){ const k = prompt("Tempel Gemini API Key (diawali AIza). Disimpan hanya di HP ini.", getKey()); if (k !== null) { try{Android.saveKey(k.trim()); Android.saveKey(k.trim()); localStorage.setItem("gkey", k.trim())}catch(e){} } return getKey(); }

const chat = document.getElementById("chat"), txt = document.getElementById("txt"),
  send = document.getElementById("send"), file = document.getElementById("file"),
  preview = document.getElementById("preview"), pimg = document.getElementById("pimg");
let history = [], image = null, busy = false;

function showEmpty(){
  chat.innerHTML = `<div class="empty"><h2>Halo, mau tanya apa?</h2>
  Ketik soal, unggah foto soal, atau pindai layar.
  <div class="chips">
    <button class="chip" data-q="Jelaskan langkah demi langkah soal ini.">Jelaskan soal</button>
    <button class="chip" data-q="Bacakan teks pada gambar ini.">Baca gambar</button>
    <button class="chip" data-q="Rangkum isi layar ini.">Rangkum layar</button>
  </div></div>`;
  chat.querySelectorAll(".chip").forEach(c => c.onclick = () => { txt.value = c.dataset.q; txt.focus(); });
}
showEmpty();
  
// ===== FITUR SUARA NIKO =====
let voiceEnabled = false;
let waitingCommand = false;
let recognition = null;

function bicaraNiko(teks) {
  if (!voiceEnabled) return;

  speechSynthesis.cancel();

  const suara = new SpeechSynthesisUtterance(teks);
  suara.lang = "id-ID";
  suara.rate = 1;
  suara.pitch = 1;

  speechSynthesis.speak(suara);
}

function mulaiNiko() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Browser belum mendukung pengenalan suara.");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "id-ID";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const hasil = event.results[event.results.length - 1];

    if (!hasil.isFinal) return;

    const ucapan = hasil[0].transcript.toLowerCase().trim();

    if (!waitingCommand && ucapan.includes("niko")) {
      const perintah = ucapan.replace(/.*?niko/, "").trim();

      if (perintah) {
        txt.value = perintah;
        kirim();
      } else {
        waitingCommand = true;
        bicaraNiko("Ya, saya mendengarkan.");
      }

    } else if (waitingCommand) {
      waitingCommand = false;
      txt.value = ucapan;
      kirim();
    }
  };

  recognition.onend = function() {
    if (voiceEnabled) {
      try { recognition.start(); } catch(e) {}
    }
  };

  recognition.start();
}

function hentikanNiko() {
  voiceEnabled = false;
  waitingCommand = false;

  if (recognition) recognition.stop();

  speechSynthesis.cancel();
}
// ===== AKHIR FITUR NIKO =====

// ===== NIKO NATIVE =====
let nk={speak:true,always:true,wake:'niko',lang:'id-ID',rate:1};
try{Object.assign(nk,JSON.parse(localStorage.getItem('nkset')||'{}'));}catch(e){}
function nkSave(){try{localStorage.setItem('nkset',JSON.stringify(nk));}catch(e){}}
const nkOrb=document.getElementById('nkOrb');
let nkManual=false,nkStopped=false;
function nkState(s){nkOrb.className=s||'';}
function nkListen(manual){
  if(!window.NikoNative){if(manual)alert('Fitur suara hanya jalan di aplikasi Android');return;}
  nkManual=manual;nkStopped=false;nkState('listen');
  NikoNative.listen(nk.lang);
}
function nkStop(){
  nkStopped=true;
  try{NikoNative.stop();}catch(e){}
  try{speechSynthesis.cancel();}catch(e){}
  nkState('');
}
function nkSpeak(t,done){
  if(!nk.speak||!window.speechSynthesis||!t){if(done)done();return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang=nk.lang;u.rate=nk.rate;
    u.onstart=()=>nkState('speak');
    u.onend=u.onerror=()=>{nkState('');if(done)done();};
    speechSynthesis.speak(u);
  }catch(e){if(done)done();}
}
async function nkSend(cmd){
  txt.value=cmd;
  await kirim();
  await new Promise(r=>setTimeout(r,400));
  while(busy) await new Promise(r=>setTimeout(r,300));
  const m=chat.querySelectorAll('.msg.ai:not(.err)'),last=m[m.length-1];
  nkSpeak(last?last.innerText:'',()=>{if(nk.always&&!nkStopped)nkListen(false);});
}
window.onNikoState=s=>nkState(s);
window.onNikoResult=t=>{
  nkState('think');
  if(nkManual){nkSend(t);return;}
  const low=t.toLowerCase(),wk=(nk.wake||'niko').toLowerCase(),i=low.indexOf(wk);
  if(i<0){nkState('');setTimeout(()=>nkListen(false),400);return;}
  const cmd=t.slice(i+wk.length).replace(/^[\s,.:]+/,'').trim();
  if(cmd)nkSend(cmd);
  else nkSpeak('Ya, saya mendengarkan',()=>nkListen(true));
};
window.onNikoError=e=>{
  nkState('');
  if(e==='9'){alert('Izin mikrofon belum diberikan. Aktifkan di Setelan > Aplikasi > Izin.');return;}
  if(e==='tidak tersedia'){alert('Mesin suara Google tidak ditemukan. Aktifkan aplikasi Google dan Layanan Suara.');return;}
  if(nk.always&&!nkStopped)setTimeout(()=>nkListen(false),1500);
};
function nkTap(){
  const c=nkOrb.className;
  if(c==='listen'||c==='speak'||c==='think')nkStop();else nkListen(true);
}
nkOrb.onclick=nkTap;
document.getElementById('nkMic').onclick=nkTap;
const nkP=document.getElementById('nkPanel');
document.getElementById('nkSet').onclick=()=>{nkP.hidden=false;};
document.getElementById('nkClose').onclick=()=>{nkP.hidden=true;};
const nkq=id=>document.getElementById(id);
nkq('nkSpeak').checked=nk.speak;
nkq('nkAlways').checked=nk.always;
nkq('nkWake').value=nk.wake;
nkq('nkLang').value=nk.lang;
nkq('nkRate').value=nk.rate;
nkq('nkSpeak').onchange=e=>{nk.speak=e.target.checked;nkSave();};
nkq('nkAlways').onchange=e=>{nk.always=e.target.checked;nkSave();if(nk.always)nkListen(false);else nkStop();};
nkq('nkWake').onchange=e=>{nk.wake=(e.target.value||'niko').trim().toLowerCase();nkSave();};
nkq('nkLang').onchange=e=>{nk.lang=e.target.value;nkSave();};
nkq('nkRate').oninput=e=>{nk.rate=parseFloat(e.target.value);nkSave();};
mulaiNiko=function(){nkStopped=false;nkListen(false);};
hentikanNiko=function(){nkStop();};
if(nk.always)setTimeout(()=>nkListen(false),2000);
nkq('nkBg').onclick=()=>{if(!window.NikoNative){alert('Hanya di aplikasi Android');return;}nk.always=false;nkq('nkAlways').checked=false;nkSave();nkStop();NikoNative.startBg();alert('NIKO aktif di latar belakang. Ucapkan: niko, buka TikTok');};
nkq('nkBgOff').onclick=()=>{try{NikoNative.stopBg();}catch(e){}};
nkq('nkAcc').onclick=()=>{try{NikoNative.openAccess();}catch(e){}};
nkq('nkBat').onclick=()=>{try{NikoNative.openBattery();}catch(e){}};
// ===== AKHIR NIKO NATIVE =====

// ===== HISTORI =====
let hsCur=null,hsT=null;
function hsLoad(){try{return JSON.parse(localStorage.getItem('hist')||'[]');}catch(e){return [];}}
function hsStore(a){try{localStorage.setItem('hist',JSON.stringify(a.slice(0,30)));}catch(e){}}
function hsSave(){
  if(!history||!history.length)return;
  const a=hsLoad();
  if(!hsCur)hsCur='h'+Date.now();
  const first=history.find(m=>m.role==='user');
  const item={id:hsCur,title:((first&&first.text)||'Obrolan').slice(0,40),time:Date.now(),
    msgs:history.map(m=>({role:m.role,text:m.text||''}))};
  const i=a.findIndex(x=>x.id===hsCur);
  if(i>=0)a.splice(i,1);
  a.unshift(item);
  hsStore(a);
}
new MutationObserver(()=>{clearTimeout(hsT);hsT=setTimeout(hsSave,800);}).observe(chat,{childList:true,subtree:true,characterData:true});
const hsP=document.getElementById('hsPanel'),hsL=document.getElementById('hsList');
function hsRender(){
  hsL.innerHTML='';
  const a=hsLoad();
  if(!a.length){hsL.textContent='Belum ada histori.';return;}
  a.forEach(it=>{
    const row=document.createElement('div');row.className='hsRow';
    const b=document.createElement('button');b.className='hsItem';
    const d=new Date(it.time);
    b.textContent=it.title+' · '+d.toLocaleDateString('id-ID')+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    b.onclick=()=>hsOpen(it.id);
    const x=document.createElement('button');x.className='hsDel';x.textContent='🗑';
    x.onclick=()=>{hsStore(hsLoad().filter(z=>z.id!==it.id));if(hsCur===it.id)hsCur=null;hsRender();};
    row.append(b,x);hsL.append(row);
  });
}
function hsOpen(id){
  const it=hsLoad().find(z=>z.id===id);
  if(!it)return;
  history=it.msgs.map(m=>({role:m.role,text:m.text}));
  hsCur=id;
  chat.innerHTML='';
  it.msgs.forEach(m=>add(m.role==='user'?'user':'ai',m.text));
  try{setImage(null);}catch(e){}
  hsP.hidden=true;
}
document.getElementById('hsBtn').onclick=()=>{hsRender();hsP.hidden=false;};
document.getElementById('hsClose').onclick=()=>{hsP.hidden=true;};
document.getElementById('hsNew').onclick=()=>{
  history=[];hsCur=null;
  try{setImage(null);}catch(e){}
  showEmpty();hsP.hidden=true;
};
document.getElementById('hsAll').onclick=()=>{
  if(confirm('Hapus semua histori?')){hsStore([]);hsCur=null;hsRender();}
};
document.getElementById('clear').addEventListener('click',()=>{hsCur=null;});
// ===== AKHIR HISTORI =====




function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")}

function add(role, text, img, cls){
  const e = chat.querySelector(".empty"); if (e) e.remove();
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "ai") + (cls ? " " + cls : "");
  if (img){ const i = document.createElement("img"); i.src = img; d.appendChild(i); }
  const t = document.createElement("span"); t.innerHTML = fmt(text || ""); d.appendChild(t);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}

function setImage(dataUrl){
  image = dataUrl; pimg.src = dataUrl; preview.style.display = dataUrl ? "flex" : "none";
}

function shrink(src){
  return new Promise((ok, no) => {
    const im = new Image();
    im.onload = () => {
      const m = 1600, k = Math.min(1, m / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.85));
    };
    im.onerror = () => no(new Error("Gambar tidak bisa dibaca"));
    im.src = src;
  });
}

document.getElementById("cam").onclick = () => file.click();
file.onchange = () => {
  const f = file.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => { try { setImage(await shrink(r.result)); } catch(e){ add("ai", e.message, null, "err"); } };
  r.readAsDataURL(f); file.value = "";
};
document.getElementById("prm").onclick = () => setImage(null);

document.getElementById("scr").onclick = async () => {
  Android.startScreenCapture();
  };

async function kirim(){
  if (busy) return;
  const text = txt.value.trim();
  if (!text && !image) return;
  busy = true; send.disabled = true;
  const img = image;
  add("user", text, img);
  history.push({role:"user", text, image: img});
  txt.value = ""; txt.style.height = "auto"; setImage(null);
  const wait = add("ai", "", null);
  wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  try{
    let key = getKey() || askKey();
    if (!key) throw new Error("API Key belum diisi (tekan tombol Kunci)");
    const contents = [];
    history.forEach((m,i)=>{
      const parts = [{text: m.text || (m.image ? "Jelaskan gambar ini." : "")}];
      if (m.role==="user" && m.image && i===history.length-1)
        parts.push({inline_data:{mime_type:"image/jpeg", data:m.image.split(",")[1]}});
      contents.push({role: m.role==="assistant" ? "model" : "user", parts});
    });
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent", {
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body: JSON.stringify({
        systemInstruction:{parts:[{text:"Kamu asisten AI yang menjawab dalam bahasa Indonesia dengan jelas dan ringkas."}]},
        contents
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error((d.error && d.error.message) || "Terjadi kesalahan");
    const cand = d.candidates && d.candidates[0];
    const reply = (cand && cand.content && cand.content.parts) ? cand.content.parts.map(p=>p.text||"").join("") : "";
    if (!reply) throw new Error("Tidak ada jawaban (mungkin diblokir filter). Coba pertanyaan lain.");
    wait.innerHTML = fmt(reply);
    history.push({role:"assistant", text:reply});
  }catch(e){
    wait.classList.add("err");
    wait.textContent = "Gagal: " + e.message;
    history.pop();
  }
  busy = false; send.disabled = false; chat.scrollTop = chat.scrollHeight;
}

send.onclick = kirim;
txt.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)){ e.preventDefault(); kirim(); } });
txt.addEventListener("input", () => { txt.style.height = "auto"; txt.style.height = Math.min(txt.scrollHeight,120) + "px"; });
document.getElementById("key").onclick = () => askKey();
document.getElementById("clear").onclick = () => { history = []; setImage(null); showEmpty(); };
  document.getElementById("voiceBtn").onclick = function() {
  if (voiceEnabled) {
    hentikanNiko();
    this.textContent = "🎙️";
  } else {
    voiceEnabled = true;
    mulaiNiko();
    this.textContent = "🔴";
  }
};
</script>
</body>
</html>
